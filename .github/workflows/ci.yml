name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (unit + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: make cover
      - run: go test ./... -race

  integration:
    name: backend (docker join harness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run compose join flow
        run: go test ./deploy/... -tags=integration -timeout=300s
